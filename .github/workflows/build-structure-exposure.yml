name: Build Comite structure exposure counts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_structure_exposure.py'
      - '.github/workflows/build-structure-exposure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests shapely

      - name: Build exposure counts
        run: python scripts/build_structure_exposure.py

      - name: Commit generated counts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/comite-fim/exposure_counts.json
          if git diff --cached --quiet; then
            echo 'No exposure-count changes.'
            exit 0
          fi
          git commit -m 'Update Comite structure exposure counts'
          git pull --rebase origin main
          git push origin HEAD:main
