name: Inspect Comite FIM source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-comite-fim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ScienceBase item, WMS, and file access
        shell: bash
        run: |
          set -x
          ITEM=5b28123ae4b0592076260622
          ITEM_JSON="https://www.sciencebase.gov/catalog/item/${ITEM}?format=json"
          OLD_WMS="https://www.sciencebase.gov/catalogMaps/mapping/ows/${ITEM}?service=wms&request=getcapabilities&version=1.3.0"
          ZIP="https://www.sciencebase.gov/catalog/file/get/${ITEM}?name=Amite_Comite_Maps104_127.zip"

          curl -L -sS "$ITEM_JSON" -o item.json || true
          echo '--- ITEM JSON LINKS ---'
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('item.json')
          if not p.exists():
              print('no item json')
              raise SystemExit
          try:
              d=json.loads(p.read_text())
          except Exception as e:
              print('json parse failed',e)
              print(p.read_text(errors='ignore')[:2000])
              raise SystemExit
          print('distributionLinks:')
          for x in d.get('distributionLinks',[]):
              print(x)
          print('files:')
          for x in d.get('files',[]):
              print({k:x.get(k) for k in ('name','url','pathOnDisk','size','contentType','s3Object')})
          PY

          curl -L -sS -D headers.txt "$OLD_WMS" -o capabilities.xml || true
          echo '--- OLD WMS HEADERS ---'
          cat headers.txt || true
          echo '--- OLD WMS BODY ---'
          head -40 capabilities.xml || true

          echo '--- DIRECT FILE HEAD ---'
          curl -L -sS -I "$ZIP" || true

          echo '--- RANGE TEST ---'
          curl -L -sS -r 0-99 -D range_headers.txt "$ZIP" -o range.bin || true
          cat range_headers.txt || true
          wc -c range.bin || true
          xxd -l 64 range.bin || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: comite-fim-diagnostics
          path: |
            item.json
            capabilities.xml
            headers.txt
            range_headers.txt
            range.bin
