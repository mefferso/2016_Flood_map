name: Inspect Comite FIM source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-comite-fim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ScienceBase item and WMS links
        shell: bash
        run: |
          set -x
          ITEM=5b28123ae4b0592076260622
          curl -L -sS "https://www.sciencebase.gov/catalog/item/${ITEM}?format=json" -o item.json
          python - <<'PY'
          import json
          d=json.load(open('item.json'))
          print('distributionLinks:')
          for x in d.get('distributionLinks',[]): print(x)
          print('files:')
          for x in d.get('files',[]):
              print({k:x.get(k) for k in ('name','url','pathOnDisk','size','contentType','s3Object')})
          PY

          OLD_WMS="https://www.sciencebase.gov/catalogMaps/mapping/ows/${ITEM}?service=wms&request=getcapabilities&version=1.3.0"
          curl -L -sS -D headers.txt "$OLD_WMS" -o capabilities.xml || true
          echo '--- OLD WMS STATUS ---'
          head -1 headers.txt || true
          head -10 capabilities.xml || true

          echo '--- DIRECT FILE HEAD ---'
          curl -L -sS -I "https://www.sciencebase.gov/catalog/file/get/${ITEM}?name=Amite_Comite_Maps104_127.zip" | head -20 || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: comite-fim-diagnostics
          path: |
            item.json
            capabilities.xml
            headers.txt
