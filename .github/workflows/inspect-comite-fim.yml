name: Inspect Comite FIM source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-comite-fim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ScienceBase range support
        shell: bash
        run: |
          set -x
          ITEM=5b28123ae4b0592076260622
          curl -L -sS "https://www.sciencebase.gov/catalog/item/${ITEM}?format=json" -o item.json
          URL=$(python - <<'PY'
          import json
          d=json.load(open('item.json'))
          for f in d.get('files',[]):
              if f.get('name') == 'Amite_Comite_Maps104_127.zip':
                  print(f['url']); break
          PY
          )
          echo "$URL"
          set +e
          curl -L -r 0-0 --max-filesize 2 -D range_headers.txt "$URL" -o range.bin
          RC=$?
          set -e
          echo "curl rc=$RC"
          cat range_headers.txt || true
          wc -c range.bin || true
          xxd -l 16 range.bin || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: comite-fim-range-diagnostics
          path: |
            item.json
            range_headers.txt
            range.bin
